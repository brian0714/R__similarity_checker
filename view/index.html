<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clustered Documents</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <button id="menu-button" class="menu-button">☰</button>
            <h1>Clustered Documents</h1>
        </header>
        <div id="container">
            <aside id="sidebar" class="sidebar">
                <ul id="cluster-list" class="cluster-list"></ul>
            </aside>
            <main id="content" class="content">
                <section>
                    <h2>Welcome</h2>
                    <p>This website displays clustered documents based on NLP analysis. Select a cluster from the sidebar to view its documents.</p>
                </section>
            </main>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
