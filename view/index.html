<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clustered Documents</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <button id="menu-button" class="menu-button">☰</button>
            <h1 id="home-button" class="home-button">Clustered Documents</h1>
        </header>
        <div id="container">
            <aside id="sidebar" class="sidebar">
                <br>
                <br>
                <ul id="data-list" class="data-list">
                    <li><button id="creative-data-button" class="data-button">Creative Data</button>
                        <ul id="creative-cluster-list" class="cluster-list hidden"></ul>
                    </li>
                    <li><button id="practical-data-button" class="data-button">Practical Data</button>
                        <ul id="practical-cluster-list" class="cluster-list hidden"></ul>
                    </li>
                </ul>
            </aside>
            <main id="content" class="content">
                <section>
                    <h2>Welcome</h2>
                    <p>This website displays clustered documents based on NLP analysis. Select a dataset from the sidebar to explore its clusters and documents.</p>
                </section>
            </main>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
